name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test the server
        run: |
          node packages/server/dist/cli.js --port 4319 --data "$RUNNER_TEMP/conjecture" &
          SERVER=$!
          for i in $(seq 1 30); do
            if curl -sf localhost:4319/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf localhost:4319/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          # Seeding runs real searches, so give it a moment before asserting.
          sleep 20
          curl -sf localhost:4319/api/workspace | grep -q 'Euler'
          kill $SERVER
